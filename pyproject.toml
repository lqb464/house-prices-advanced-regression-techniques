[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "StocKast"
version = "1.0.0"
description = "Framework dự báo stock time-series bằng ML truyền thống, recurrent neural network và quality gate"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0.0",
    "yfinance>=0.2.36",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.28",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "backend*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=.pytest_tmp"
