name: StocKast DS MLE CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Thiết lập Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cài đặt dependency
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api]"

    - name: Kiểm tra compile và import
      run: python -m compileall -q src scripts backend tests

    - name: Kiểm tra lỗi lint nghiêm trọng
      run: flake8 src scripts tests backend --max-line-length=100 --extend-ignore=E203,W503,E402,E501

    - name: Chạy test
      run: pytest

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Build frontend
      run: npm ci --prefix frontend && npm run build --prefix frontend

    - name: Build image API
      run: docker build -f backend/Dockerfile -t stockast-api:ci .
